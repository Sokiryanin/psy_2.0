<div class="header__menu menu">
  <button type="button" data-fls-menu class="menu__icon icon-menu">
    <span></span>
  </button>
  <nav class="menu__body">
    <ul class="menu__list">
      <each
        loop='item in [
					{"href": "/about.html","ancor": "Про мене","slug":"about"},
					{"href": "/services.html","ancor": "Послуги","slug":"services"},
					{"href": "/partners.html","ancor": "Партнерство","slug":"partners"},
					{"href": "/webinars.html","ancor": "Вебінари","slug":"webinars"},
					{"href": "/blog.html","ancor": "Блог","slug":"blog"}
				]'
      >
        <if condition="'[[active]]' === '[[item.slug]]'">
          <li class="menu__item">
            <a href="[[item.href]]" class="menu__link menu__link--active"
              >[[item.ancor]]</a
            >
          </li>
        </if>
        <else>
          <li class="menu__item">
            <a href="[[item.href]]" class="menu__link">[[item.ancor]]</a>
          </li>
        </else>
      </each>
    </ul>
  </nav>
</div>
